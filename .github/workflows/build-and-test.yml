name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  reuseaction:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5
  markdownlinkcheck:
    name: Markdown Link Check
    permissions:
      contents: read
      pull-requests: read
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5
  eslint:
    name: ESLint
    uses: SchmiedmayerLab/.github/.github/workflows/eslint.yml@v0.5
    permissions:
      contents: read
      checks: write
  testandcoverage:
    name: Test and Coverage
    uses: SchmiedmayerLab/.github/.github/workflows/npm-test-coverage.yml@v0.5
    with:
      nodeVersionFile: package.json
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
  endtoendtests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build the backend
        run: npm --prefix ENGAGE-HF-Firebase run prepare
      - name: Run the end-to-end tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dockercomposetest:
    name: Docker Compose & Test
    uses: SchmiedmayerLab/.github/.github/workflows/docker-compose-test.yml@v0.5
    with:
      dockerComposeFile: docker-compose-development.yml
      testscript: test.sh
    secrets:
      ENV_FILE: |
        VITE_PUBLIC_FIREBASE_API_KEY='${{ secrets.VITE_PUBLIC_FIREBASE_API_KEY }}'
        VITE_PUBLIC_FIREBASE_AUTH_DOMAIN='${{ secrets.VITE_PUBLIC_FIREBASE_AUTH_DOMAIN }}'
        VITE_PUBLIC_FIREBASE_PROJECT_ID='${{ secrets.VITE_PUBLIC_FIREBASE_PROJECT_ID }}'
        VITE_PUBLIC_FIREBASE_STORAGE_BUCKET='${{ secrets.VITE_PUBLIC_FIREBASE_STORAGE_BUCKET }}'
        VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID='${{ secrets.VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}'
        VITE_PUBLIC_FIREBASE_APP_ID='${{ secrets.VITE_PUBLIC_FIREBASE_APP_ID }}'
